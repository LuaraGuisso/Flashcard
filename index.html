<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards Dinâmicos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Meus Flashcards</h1>

    <div class="container">
        <!-- O Card único que recebe os dados do banco -->
        <div class="card" id="flashcard">
            <div class="card-interno" id="card-interno">
                <div class="frente">
                    <h2 id="titulo-frente">Carregando...</h2>
                    <p id="texto-frente">Buscando informações no banco de dados...</p>
                </div>
                <div class="verso">
                    <div class="imagem">
                        <img id="img-verso" src="" alt="Imagem explicativa">
                    </div>
                    <h2 id="titulo-verso">Carregando...</h2>
                </div>
            </div>
        </div>

        <!-- Botões de controle de fluxo -->
        <div class="controles">
            <button id="btn-voltar" class="btn">Voltar</button>
            <span id="indicador-pagina">1 / --</span>
            <button id="btn-avancar" class="btn">Avançar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
